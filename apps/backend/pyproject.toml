[project]
name = "rover-backend"
version = "0.0.0"
description = "Backend de Rover (FastAPI). La implementación real llega en HU-0.4."
requires-python = ">=3.12"
# Sin dependencias de app todavía — se añaden en HU-0.4.
dependencies = []

[tool.uv]
# Proyecto-aplicación: no es un paquete instalable, solo un entorno gestionado por uv.
package = false

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.20",
]

# Ruff: linter + formateador (reemplaza black + flake8 + isort).
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Reglas estándar y razonables, sin volverse agresivo:
#   E/W = pycodestyle, F = pyflakes, I = isort (orden de imports),
#   UP = pyupgrade, B = flake8-bugbear.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.format]
# Estilo por defecto de Ruff (equivalente a black).
quote-style = "double"

# mypy: type-checking estricto. Fuera de Turborepo (mismo patrón que Ruff).
[tool.mypy]
python_version = "3.12"
strict = true
# strict ya implica estos, pero los dejamos explícitos por claridad:
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
# No tipar el entorno virtual ni librerías instaladas.
exclude = ['\.venv/']
