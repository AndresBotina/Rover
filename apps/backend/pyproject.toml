[project]
name = "rover-backend"
version = "0.1.0"
description = "Backend de Rover (FastAPI): esqueleto desplegable con healthcheck."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.138.1",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.49.0",
]

[tool.uv]
# Proyecto-aplicación: no es un paquete instalable, solo un entorno gestionado por uv.
package = false

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

# Ruff: linter + formateador (reemplaza black + flake8 + isort).
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Reglas estándar y razonables, sin volverse agresivo:
#   E/W = pycodestyle, F = pyflakes, I = isort (orden de imports),
#   UP = pyupgrade, B = flake8-bugbear.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.format]
# Estilo por defecto de Ruff (equivalente a black).
quote-style = "double"

# mypy: type-checking estricto. Fuera de Turborepo (mismo patrón que Ruff).
[tool.mypy]
python_version = "3.12"
strict = true
# strict ya implica estos, pero los dejamos explícitos por claridad:
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
# Plugin de Pydantic v2 para validar modelos/Settings bajo strict.
plugins = ["pydantic.mypy"]
# No tipar el entorno virtual ni librerías instaladas.
exclude = ['\.venv/']
